name: Generate feed

on:
  schedule:
    # Keep ten-minute updates away from the :00/:30 traffic spikes.
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write

concurrency:
  group: generate-feed
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: kuresel-haberler
          workload_identity_provider: projects/529641647663/locations/global/workloadIdentityPools/github-actions/providers/github-actions
          service_account: kuresel-feed-fcm-sender@kuresel-haberler.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/firebase.messaging

      - run: npm ci

      - run: npm run generate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
          FCM_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          FCM_PROJECT_ID: kuresel-haberler

      - run: npm run markets

      - name: Commit updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Preserve this run's generated output while refreshing the branch.
          # Rebasing two generated JSON snapshots conflicts whenever another
          # scheduled run commits first, so retry from the newest main instead.
          generated_dir="$(mktemp -d)"
          cp docs/haberler.json docs/markets.json "$generated_dir/"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp "$generated_dir/haberler.json" "$generated_dir/markets.json" docs/
            git add docs/haberler.json docs/markets.json
            if git diff --cached --quiet; then
              echo "Değişiklik yok, commit atlanıyor"
              exit 0
            fi
            git commit -m "chore: haberler.json ve markets.json güncelle"
            if git push; then
              rm -rf "$generated_dir"
              exit 0
            fi
            echo "Push reddedildi (deneme $i/5), güncel main üzerinden yeniden deneniyor..."
            sleep $((RANDOM % 5 + 1))
          done
          rm -rf "$generated_dir"
          echo "5 denemeden sonra push başarısız oldu." >&2
          exit 1
